[project]
name = "npu-train"
version = "0.1.0"
description = "LoRA fine-tuning on ahead-of-time compiled NPUs (FuriosaAI RNGD), with CPU/CUDA reference backends"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors", "transformers>=5.1", "huggingface_hub",
                "rm-core @ git+https://github.com/ai-computing/rm-core@v0.1.1"]

[project.optional-dependencies]
# furiosa-torch 는 Furiosa SDK 와 함께 설치된다(PyPI 버전 고정 필요 없음).

[project.scripts]
npu-train = "npu_train.cli:main"
npu-lora = "npu_train.cli:main"   # old command name, kept

[project.entry-points."airm.workloads"]
npu-lora = "npu_train.airm:train"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# npu_lora: deprecated alias of npu_train (compatibility shim), kept for existing commands
include = ["npu_train*", "npu_lora*"]
